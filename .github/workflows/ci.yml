name: CI

on:
  pull_request:
    branches:
      - main
      - master
      - "review/**"
  push:
    branches:
      - "review/**"

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, Lint, Test & Build (Node 22)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run unit & contract tests
        run: npm test

      - name: Build package
        run: npm run build

      - name: Dependency security audit
        run: npm audit --audit-level=high
