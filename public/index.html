<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DIP Analytics</title>
    <meta
      name="description"
      content="Secure, tenant-aware analytics domain, versioned event contracts, deterministic aggregations, and reporting foundation for Digital India Project."
    />
    <meta property="og:title" content="DIP Analytics" />
    <meta
      property="og:description"
      content="Secure, tenant-aware analytics domain, versioned event contracts, deterministic aggregations, and reporting foundation for Digital India Project."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/assets/app.css" />
  </head>
  <body class="bg-[var(--dip-bg-canvas)] text-[var(--dip-text-primary)] min-h-screen">
    <div id="app-shell" class="min-h-screen flex flex-col lg:flex-row">
      <!-- Mobile Drawer Backdrop -->
      <div
        id="mobile-sidebar-backdrop"
        class="fixed inset-0 z-30 bg-black/50 hidden lg:hidden"
        aria-hidden="true"
      ></div>

      <!-- dip-ui Sidebar (260px desktop, collapsible to 72px rail) -->
      <aside
        id="workspace-sidebar"
        aria-label="Primary analytics navigation"
        class="fixed inset-y-0 left-0 z-40 w-[260px] shrink-0 bg-[var(--dip-bg-surface)] text-[var(--dip-text-primary)] border-r border-[var(--dip-border)] flex flex-col justify-between transform -translate-x-full lg:translate-x-0 lg:static transition-[transform,width] duration-150 ease-out"
      >
        <div>
          <div class="min-h-[60px] px-4 flex items-center justify-between gap-3 border-b border-[var(--dip-border)]">
            <a
              href="/"
              class="flex items-center gap-3 min-w-0 whitespace-nowrap shrink-0 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[var(--dip-focus-ring)] rounded-md"
            >
              <!-- DipBrandMark SVG -->
              <svg viewBox="0 0 28 28" fill="none" aria-hidden="true" class="h-7 w-7 shrink-0">
                <rect width="28" height="28" rx="6" fill="var(--dip-brand-red)" />
                <path d="M7 8.5h14" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" />
                <path d="M7 14h10" stroke="#FDBA74" stroke-width="2.2" stroke-linecap="round" />
                <path d="M7 19.5h14" stroke="#86EFAC" stroke-width="2.2" stroke-linecap="round" />
              </svg>
              <span class="sidebar-label dip-font-display text-base font-bold tracking-tight text-[var(--dip-text-primary)] whitespace-nowrap">
                DIP Analytics
              </span>
            </a>
            <button
              id="close-sidebar-btn"
              type="button"
              class="lg:hidden p-2 rounded-[var(--dip-radius-md)] text-[var(--dip-text-muted)] hover:bg-[var(--dip-bg-subtle)] hover:text-[var(--dip-text-primary)] focus-visible:outline-2 focus-visible:outline-[var(--dip-focus-ring)]"
              aria-label="Close navigation menu"
            >
              <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.75" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
              </svg>
            </button>
          </div>

          <nav class="px-3 py-4 space-y-5" id="sidebar-nav">
            <div>
              <p class="sidebar-label px-3 mb-2 text-xs font-semibold text-[var(--dip-text-muted)]">
                Intelligence
              </p>
              <ul class="space-y-1">
                <li>
                  <button
                    type="button"
                    data-view="executive"
                    title="Executive Overview"
                    class="nav-item w-full flex items-center gap-3 rounded-[var(--dip-radius-md)] px-3 min-h-[40px] text-sm font-medium text-left transition-colors whitespace-nowrap shrink-0 focus-visible:outline-2 focus-visible:outline-[var(--dip-focus-ring)]"
                  >
                    <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24" aria-hidden="true">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M3 3v18h18M7 16v-4m5 4V8m5 8v-6" />
                    </svg>
                    <span class="sidebar-label">Executive Overview</span>
                  </button>
                </li>
                <li>
                  <button
                    type="button"
                    data-view="operations"
                    title="Operations & Backlog"
                    class="nav-item w-full flex items-center gap-3 rounded-[var(--dip-radius-md)] px-3 min-h-[40px] text-sm font-medium text-left transition-colors whitespace-nowrap shrink-0 focus-visible:outline-2 focus-visible:outline-[var(--dip-focus-ring)]"
                  >
                    <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24" aria-hidden="true">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
                    </svg>
                    <span class="sidebar-label">Operations &amp; Backlog</span>
                  </button>
                </li>
                <li>
                  <button
                    type="button"
                    data-view="finance"
                    title="Finance & Economics"
                    class="nav-item w-full flex items-center gap-3 rounded-[var(--dip-radius-md)] px-3 min-h-[40px] text-sm font-medium text-left transition-colors whitespace-nowrap shrink-0 focus-visible:outline-2 focus-visible:outline-[var(--dip-focus-ring)]"
                  >
                    <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24" aria-hidden="true">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8V6m0 12v-2m9-4a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                    <span class="sidebar-label">Finance &amp; Economics</span>
                  </button>
                </li>
                <li>
                  <button
                    type="button"
                    data-view="entities"
                    title="Partners & Workforce"
                    class="nav-item w-full flex items-center gap-3 rounded-[var(--dip-radius-md)] px-3 min-h-[40px] text-sm font-medium text-left transition-colors whitespace-nowrap shrink-0 focus-visible:outline-2 focus-visible:outline-[var(--dip-focus-ring)]"
                  >
                    <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24" aria-hidden="true">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z" />
                    </svg>
                    <span class="sidebar-label">Partners &amp; Workforce</span>
                  </button>
                </li>
              </ul>
            </div>

            <div>
              <p class="sidebar-label px-3 mb-2 text-xs font-semibold text-[var(--dip-text-muted)]">
                Platform &amp; Controls
              </p>
              <ul class="space-y-1">
                <li>
                  <button
                    type="button"
                    data-view="api"
                    title="API & Anomalies"
                    class="nav-item w-full flex items-center gap-3 rounded-[var(--dip-radius-md)] px-3 min-h-[40px] text-sm font-medium text-left transition-colors whitespace-nowrap shrink-0 focus-visible:outline-2 focus-visible:outline-[var(--dip-focus-ring)]"
                  >
                    <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24" aria-hidden="true">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z" />
                    </svg>
                    <span class="sidebar-label">API &amp; Anomalies</span>
                  </button>
                </li>
                <li>
                  <button
                    type="button"
                    data-view="export"
                    title="Export Studio"
                    class="nav-item w-full flex items-center gap-3 rounded-[var(--dip-radius-md)] px-3 min-h-[40px] text-sm font-medium text-left transition-colors whitespace-nowrap shrink-0 focus-visible:outline-2 focus-visible:outline-[var(--dip-focus-ring)]"
                  >
                    <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24" aria-hidden="true">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                    </svg>
                    <span class="sidebar-label">Export Studio</span>
                  </button>
                </li>
                <li>
                  <button
                    type="button"
                    data-view="governance"
                    title="Privacy & Contracts"
                    class="nav-item w-full flex items-center gap-3 rounded-[var(--dip-radius-md)] px-3 min-h-[40px] text-sm font-medium text-left transition-colors whitespace-nowrap shrink-0 focus-visible:outline-2 focus-visible:outline-[var(--dip-focus-ring)]"
                  >
                    <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24" aria-hidden="true">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M12 3l7 4v5c0 5-3.5 8-7 9-3.5-1-7-4-7-9V7l7-4z" />
                    </svg>
                    <span class="sidebar-label">Privacy &amp; Contracts</span>
                  </button>
                </li>
              </ul>
            </div>
          </nav>
        </div>

        <div class="sidebar-label p-4 border-t border-[var(--dip-border)] text-xs text-[var(--dip-text-muted)] space-y-1">
          <div class="font-medium text-[var(--dip-text-secondary)]">Synthetic Sandbox Data</div>
          <div>Zero PII · Integer Minor Units</div>
        </div>
      </aside>

      <!-- Main Workspace Column -->
      <div class="flex-1 min-w-0 flex flex-col">
        <!-- dip-ui Topbar -->
        <header class="sticky top-0 z-20 min-h-[60px] bg-[var(--dip-bg-surface)] border-b border-[var(--dip-border)] px-4 sm:px-6 lg:px-8 flex items-center justify-between gap-4">
          <div class="flex items-center gap-3 min-w-0">
            <button
              id="open-sidebar-btn"
              type="button"
              class="lg:hidden inline-flex h-10 w-10 shrink-0 items-center justify-center rounded-[var(--dip-radius-md)] border border-[var(--dip-border)] text-[var(--dip-text-secondary)] hover:bg-[var(--dip-bg-subtle)] hover:text-[var(--dip-text-primary)] focus-visible:outline-2 focus-visible:outline-[var(--dip-focus-ring)]"
              aria-label="Open navigation menu"
            >
              <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.75" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
              </svg>
            </button>
            <button
              id="collapse-sidebar-btn"
              type="button"
              class="hidden lg:inline-flex h-9 w-9 shrink-0 items-center justify-center rounded-[var(--dip-radius-md)] text-[var(--dip-text-secondary)] hover:bg-[var(--dip-bg-subtle)] hover:text-[var(--dip-text-primary)] focus-visible:outline-2 focus-visible:outline-[var(--dip-focus-ring)]"
              aria-label="Collapse sidebar"
            >
              <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 3v18M4 5h16a1 1 0 011 1v12a1 1 0 01-1 1H4a1 1 0 01-1-1V6a1 1 0 011-1z" />
              </svg>
            </button>

            <nav aria-label="Breadcrumb" class="flex items-center gap-2 text-sm min-w-0 truncate">
              <span class="text-[var(--dip-text-muted)] whitespace-nowrap">Analytics</span>
              <span class="text-[var(--dip-text-muted)]" aria-hidden="true">/</span>
              <span
                id="header-breadcrumb-title"
                class="dip-font-display font-semibold text-[var(--dip-text-primary)] truncate"
              >
                Executive Overview
              </span>
            </nav>
          </div>

          <div class="flex items-center gap-2.5 shrink-0">
            <button
              id="theme-toggle-btn"
              type="button"
              class="px-3 py-2 rounded-[var(--dip-radius-md)] text-xs font-medium border border-[var(--dip-border)] bg-[var(--dip-bg-surface)] text-[var(--dip-text-secondary)] hover:bg-[var(--dip-bg-subtle)] hover:text-[var(--dip-text-primary)] transition-colors whitespace-nowrap shrink-0 focus-visible:outline-2 focus-visible:outline-[var(--dip-focus-ring)]"
            >
              Dark Mode
            </button>
            <button
              id="quick-export-csv-btn"
              type="button"
              class="px-4 py-2 rounded-[var(--dip-radius-md)] text-xs font-semibold bg-[var(--dip-accent)] hover:bg-[var(--dip-accent-hover)] text-[var(--dip-accent-fg)] transition-colors whitespace-nowrap shrink-0 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[var(--dip-focus-ring)]"
            >
              Download CSV
            </button>
          </div>
        </header>

        <!-- Workspace Filter & Scope Toolbar -->
        <section
          aria-label="Query scope and filters"
          class="bg-[var(--dip-bg-surface)] border-b border-[var(--dip-border)] px-4 sm:px-6 lg:px-8 py-3"
        >
          <div class="max-w-[1440px] mx-auto flex flex-col xl:flex-row xl:items-center xl:justify-between gap-3">
            <div class="flex flex-wrap items-center gap-3">
              <label class="flex items-center gap-2 text-xs text-[var(--dip-text-secondary)]">
                <span class="font-medium whitespace-nowrap">Tenant</span>
                <select
                  id="filter-tenant"
                  class="px-2.5 py-1.5 rounded-[var(--dip-radius-md)] border border-[var(--dip-border)] bg-[var(--dip-bg-subtle)] text-[var(--dip-text-primary)] text-xs font-medium focus-visible:outline-2 focus-visible:outline-[var(--dip-focus-ring)]"
                >
                  <option value="tenant_alpha">tenant_alpha — National Citizen Portal</option>
                  <option value="tenant_beta">tenant_beta — State Enterprise Registry</option>
                </select>
              </label>

              <label class="flex items-center gap-2 text-xs text-[var(--dip-text-secondary)]">
                <span class="font-medium whitespace-nowrap">Timezone</span>
                <select
                  id="filter-timezone"
                  class="px-2.5 py-1.5 rounded-[var(--dip-radius-md)] border border-[var(--dip-border)] bg-[var(--dip-bg-subtle)] text-[var(--dip-text-primary)] text-xs font-medium focus-visible:outline-2 focus-visible:outline-[var(--dip-focus-ring)]"
                >
                  <option value="Asia/Kolkata">Asia/Kolkata (+05:30)</option>
                  <option value="UTC">UTC</option>
                </select>
              </label>

              <label class="flex items-center gap-2 text-xs text-[var(--dip-text-secondary)]">
                <span class="font-medium whitespace-nowrap">Service</span>
                <select
                  id="filter-service"
                  class="px-2.5 py-1.5 rounded-[var(--dip-radius-md)] border border-[var(--dip-border)] bg-[var(--dip-bg-subtle)] text-[var(--dip-text-primary)] text-xs font-medium focus-visible:outline-2 focus-visible:outline-[var(--dip-focus-ring)]"
                >
                  <option value="">All Services</option>
                </select>
              </label>

              <label class="flex items-center gap-2 text-xs text-[var(--dip-text-secondary)]">
                <span class="font-medium whitespace-nowrap">Currency</span>
                <select
                  id="filter-currency"
                  class="px-2.5 py-1.5 rounded-[var(--dip-radius-md)] border border-[var(--dip-border)] bg-[var(--dip-bg-subtle)] text-[var(--dip-text-primary)] text-xs font-medium focus-visible:outline-2 focus-visible:outline-[var(--dip-focus-ring)]"
                >
                  <option value="">All Currencies</option>
                  <option value="INR">INR</option>
                  <option value="USD">USD</option>
                </select>
              </label>

              <div
                class="inline-flex items-center p-0.5 rounded-[var(--dip-radius-md)] bg-[var(--dip-bg-subtle)] border border-[var(--dip-border)]"
                role="group"
                aria-label="Time granularity"
              >
                <button
                  type="button"
                  data-granularity="day"
                  class="gran-btn px-3 py-1 rounded-[var(--dip-radius-sm)] text-xs font-medium transition-colors whitespace-nowrap shrink-0"
                >
                  Daily
                </button>
                <button
                  type="button"
                  data-granularity="week"
                  class="gran-btn px-3 py-1 rounded-[var(--dip-radius-sm)] text-xs font-medium transition-colors whitespace-nowrap shrink-0"
                >
                  Weekly
                </button>
              </div>
            </div>

            <!-- Quiet Unboxed Metadata (Zero Pills) -->
            <div
              id="scope-metadata-line"
              class="text-xs text-[var(--dip-text-muted)] font-mono dip-tabular truncate"
            >
              Loading window metadata...
            </div>
          </div>
        </section>

        <!-- Dynamic Main Viewport -->
        <main class="flex-1 px-4 sm:px-6 lg:px-8 py-6">
          <div id="main-viewport" class="max-w-[1440px] mx-auto space-y-6"></div>
        </main>
      </div>
    </div>

    <script type="module" src="/assets/client.js"></script>
  </body>
</html>
